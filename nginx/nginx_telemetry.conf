
server {
    listen 80;
    listen [::]:80;
    server_name formula-telemetry.com www.formula-telemetry.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name formula-telemetry.com www.formula-telemetry.com;


    ssl_certificate /etc/letsencrypt/live/formula-telemetry.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formula-telemetry.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/formula-telemetry.com/chain.pem;


    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20';
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;



    # Umami Analytics -> Umami container (port 3002)
    # Proxied through /umami/* to avoid ad blockers
    location ^~ /umami/ {
        proxy_pass http://telemetry_umami:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        # Disable caching for analytics
        proxy_buffering off;
        proxy_cache off;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /api/ {
        proxy_pass http://telemetry_backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;


        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;


        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }


    location = /health {
        proxy_pass http://telemetry_backend:8001/health;
        proxy_set_header Host $host;
    }


    location ^~ /_next/static/ {
        proxy_pass http://telemetry_frontend:3001/_next/static/;
        proxy_cache_valid 200 30d;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }


    location ^~ /public/ {
        proxy_pass http://telemetry_frontend:3001/public/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }


    location ~* \.(ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|json|webmanifest|txt)$ {
        proxy_pass http://telemetry_frontend:3001;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }


    location / {
        proxy_pass http://telemetry_frontend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
