# /nginx/nginx_prod.conf
server {
    listen 80;
    listen [::]:80;
    server_name formula1datalab.com www.formula1datalab.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name formula1datalab.com www.formula1datalab.com;

    ssl_certificate /etc/letsencrypt/live/formula1datalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formula1datalab.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/formula1datalab.com/chain.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20';
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- Crucial Nginx Location Blocks Reordering and Refinement ---

    # 1. EXACT MATCH for Next.js build output (JS chunks, CSS, etc.)
    # This MUST be the first thing Nginx checks for Next.js static assets.
    # We use 'location /_next/static/' as a prefix match, which is highly specific.
    location /_next/static/ {
        alias /app/.next/static/; # Use alias because the URI path doesn't directly map to the file system root
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, immutable"; # For immutable assets (content-hashed filenames)
    }

    # 2. Handle public assets (from the 'public' folder)
    # This serves files like favicon.ico, images, directly linked CSS/JS that are NOT
    # part of the _next/static build output. Use 'root' here, as these files
    # are expected to be directly under /app/public.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot|json|webmanifest|txt)$ {
        root /app/public; # 'root' appends the URI to this path
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Proxy to Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 4. Proxy to Next.js Frontend (for all other requests)
    # All dynamic routes, API routes handled by Next.js, and any other requests
    # not explicitly served by Nginx above will go to the Next.js server.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}