
server {
    listen 80;
    server_name formula1datalab.com www.formula1datalab.com;
    return 301 https://$host$request_uri; # Permanent redirect to HTTPS
}

server {
    listen 443 ssl http2;
    server_name formula1datalab.com www.formula1datalab.com;

    ssl_certificate /etc/letsencrypt/live/formula1datalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formula1datalab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Root for your React static files (inside the container)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve React app with client-side routing support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to  Flask backend
    location /api/ {
        proxy_pass http://backend:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom error page for React client-side routing
    error_page 404 /index.html;
}