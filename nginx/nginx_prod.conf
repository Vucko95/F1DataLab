# /nginx/nginx_prod.conf
server {
    listen 80;
    listen [::]:80;
    server_name formula1datalab.com www.formula1datalab.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name formula1datalab.com www.formula1datalab.com;

    ssl_certificate /etc/letsencrypt/live/formula1datalab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/formula1datalab.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/formula1datalab.com/chain.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20';
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # --- Start of Modified Location Blocks ---

    # 1. IMPORTANT: Handle Next.js static assets first!
    # These are the build artifacts (JS chunks, CSS, etc.) generated by Next.js
    # and reside in the .next/static folder.
    location /_next/static/ {
        alias /app/.next/static/; # Point to the .next/static directory
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, immutable"; # For immutable assets (content-hashed filenames)
    }

    # 2. Handle public assets served directly from the /public folder
    # This regex catches common static file types that might be in your `public` directory
    # (e.g., favicon.ico, images, fonts, directly included CSS/JS files).
    # This prevents them from being proxied to the Next.js server if Nginx can serve them faster.
    location ~* ^/(?:favicon.ico|robots.txt|manifest.json|.+?\.(?:jpg|jpeg|gif|png|webp|ico|svg|css|js|woff2?|ttf|eot))$ {
        root /app/public; # Point to the public directory
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Proxy to Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Add CORS headers if your API needs them directly from Nginx
        # add_header 'Access-Control-Allow-Origin' '*' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }

    # 4. Proxy to Next.js Frontend (for all other requests not handled by the above specific locations)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # --- End of Modified Location Blocks ---

}