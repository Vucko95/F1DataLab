version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend_prod
      args:
        NEXT_PUBLIC_BACKEND_URL: https://formula1datalab.com/api
    image: f1datalab-frontend:latest
    container_name: f1_frontend
    # ports:
    #   - "3000:3000"
    depends_on:
      - backend
    # volumes:
    #   - frontend_build_output:/app/.next
    #   - ./frontend/public:/app/public


  backend:
    build:
      context: ./f1backend
      dockerfile: Dockerfile.backend_prod
    container_name: f1_backend_flask
    environment:
      DATABASE_URL: mysql://root:123@mysql:3306/f1db
      RUN_MODE: production
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.nginx_prod
    container_name: f1_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx_prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend


  mysql:
    image: mysql:latest
    container_name: f1_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: f1db
    command: --sql-mode="NO_ENGINE_SUBSTITUTION"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/f1db.sql:/docker-entrypoint-initdb.d/f1db.sql:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: f1_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./certbot/renewal-hook.sh:/renewal-hook.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --deploy-hook /renewal-hook.sh; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  mysql_data:
  certbot_etc:
  certbot_var:
  certbot_webroot:
  # frontend_build_output: